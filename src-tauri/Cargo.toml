[package]
name = "climax"
version = "1.1.1"
description = "Climax - personal activity tracker for adult content viewing"
authors = ["pineapplestorm"]
edition = "2021"

[lib]
name = "climax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Climax core engine (Tauri-free): DB, models, settings, Stash client,
# aggregations, mirror/reconstruct, session engine. Phase 2a extraction.
climax-core = { path = "../crates/climax-core" }

# Tauri core
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database (async SQLite)
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }

# HTTP client (Stash GraphQL writes)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Time + ids
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Windows-specific (idle detection + shutdown-block-while-tracking)
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_System_Shutdown", "Win32_Foundation"] }
